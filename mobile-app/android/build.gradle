// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "29.0.3"
        minSdkVersion = 21
        compileSdkVersion = 29
        targetSdkVersion = 29
        ndkVersion = "20.1.5948944"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:4.1.0")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }

    // Force Fresco to a version available on Maven Central.
    // com.facebook.fresco 2.0.0 and 2.2.0 were only published to JCenter (now dead).
    configurations.all {
        resolutionStrategy {
            force 'com.facebook.fresco:fresco:2.5.0'
            force 'com.facebook.fresco:animated-base:2.5.0'
            force 'com.facebook.fresco:animated-drawable:2.5.0'
            force 'com.facebook.fresco:animated-gif:2.5.0'
            force 'com.facebook.fresco:animated-webp:2.5.0'
            force 'com.facebook.fresco:drawee:2.5.0'
            force 'com.facebook.fresco:fbcore:2.5.0'
            force 'com.facebook.fresco:imagepipeline:2.5.0'
            force 'com.facebook.fresco:imagepipeline-base:2.5.0'
            force 'com.facebook.fresco:imagepipeline-core:2.5.0'
            force 'com.facebook.fresco:imagepipeline-native:2.5.0'
            force 'com.facebook.fresco:imagepipeline-okhttp3:2.5.0'
            force 'com.facebook.fresco:memory-type-ashmem:2.5.0'
            force 'com.facebook.fresco:memory-type-java:2.5.0'
            force 'com.facebook.fresco:middleware:2.5.0'
            force 'com.facebook.fresco:nativeimagefilters:2.5.0'
            force 'com.facebook.fresco:nativeimagetranscoder:2.5.0'
            force 'com.facebook.fresco:soloader:2.5.0'
            force 'com.facebook.fresco:stetho:2.5.0'
            force 'com.facebook.fresco:ui-common:2.5.0'
            force 'com.facebook.fresco:webpsupport:2.5.0'
            force 'com.facebook.fresco:flipper:2.5.0'
        }
    }
}

